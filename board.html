<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>校長儀表板｜利澤國小</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" />
</head>
<body>
<div class="app">
  <section class="view" id="v-loading"><div class="gate"><div class="gate-card"><p>正在確認帳號權限…</p></div></div></section>

  <section class="view" id="v-login" hidden><div class="gate"><div class="gate-card">
    <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="4" rx="1.5"/><rect x="13" y="10" width="7" height="10" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/></svg></div>
    <h2>校長儀表板</h2><p>宜蘭縣五結鄉利澤國民小學</p>
    <button class="gbtn" id="g-in"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.4z"/><path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.8H1.8v3A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.6 14.6a7.2 7.2 0 0 1 0-4.6v-3H1.8a12 12 0 0 0 0 10.6z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3A12 12 0 0 0 1.8 7l3.8 3c.9-2.8 3.4-5.2 6.4-5.2z"/></svg>使用 Google 帳號登入</button>
    <p class="err" id="login-err" role="alert"></p>
    <p class="fine">與基金預算管理系統共用帳號。僅限已授權的帳號，權限由系統管理員設定。</p>
  </div></div></section>

  <section class="view" id="v-denied" hidden><div class="gate"><div class="gate-card">
    <div class="mark lock"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>此帳號沒有檢視權限</h2>
    <div class="acct" id="denied-email"></div>
    <p id="denied-reason"></p>
    <button class="gbtn" id="g-other">改用其他帳號</button>
  </div></div></section>

  <section class="view" id="v-dash" hidden>
    <header class="top">
      <h1>校長儀表板</h1><div class="when" id="when"></div>
      <div class="grow" id="light"></div>
      <button class="btn" id="src-btn">資料來源</button>
      <button class="me" id="me-btn" aria-haspopup="true" aria-expanded="false"><span class="av" id="me-av" aria-hidden="true"></span><span class="nm" id="me-name"></span></button>
      <div class="menu" id="menu" role="menu">
        <div style="display:flex;gap:.75rem;align-items:center"><span class="av" id="menu-av" aria-hidden="true"></span><div><b id="menu-name"></b><div class="em" id="menu-email"></div></div></div>
        <div style="display:flex;gap:.375rem;flex-wrap:wrap"><span class="badge ok">已授權</span><span class="chip" id="menu-role"></span></div>
        <hr><button class="i" id="go-src">資料來源</button><a class="i" href="/" style="padding:.5rem .25rem;color:inherit;text-decoration:none">基金預算管理系統</a><button class="i" id="go-logout">登出</button>
      </div>
    </header>
    <div id="notices" style="display:flex;flex-direction:column;gap:.5rem"></div>
    <section id="band"></section>
    <main class="grid" id="grid"></main>
  </section>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" inert aria-label="明細"><div class="drawer-h"><h2 id="dt"></h2><button class="btn" id="close">關閉</button></div><div class="drawer-b" id="db"></div></aside>
<script type="module" src="/src/board/main.js"></script>
</body>
</html>
